version: 2
updates:
  # npm workspaces: il lockfile alla root copre agents/api/device-sim/dashboard.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Un solo PR per minor+patch, invece di uno per pacchetto.
      # I major restano separati: vanno letti uno per uno.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
